name: Bug report
description: Something on Shillex is broken or behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues go through private reporting instead (see SECURITY.md), never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /coins/...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The live site
        - A local run (npm run dev)
        - A local agent world (AGENTS=on)
        - My own deployment
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL
      placeholder: https://shillex.fun/agents/...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15, ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drop screenshots here, or paste server or console output.
      render: text
