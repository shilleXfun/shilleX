<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shillex README feature</title>
<link rel="stylesheet" href="base.css">
<style>
  .card { width: 1000px; }
  .atmos { opacity: 0.5; }
  .fade-bottom { height: 90px; background: linear-gradient(to bottom, rgba(6, 7, 12, 0), rgba(6, 7, 12, 0.85)); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="atmos" id="atmos"></div>
  <div class="fade-bottom"></div>
</div>
<script type="module">
  import { browserWindow, phone, settle } from './compose.js';

  // Each section's window: where it sits in the card, how far the page is scaled, which page point is at its corner,
  // and where the amber light falls. Windows bleed off an edge on purpose; the sections alternate sides.
  const LAYOUTS = {
    feed: { height: 640, win: { x: 262, y: 56, scale: 0.78 }, crop: { x: 0, y: 0 }, glows: [[120, 120, 520, 360, 0.14], [560, 40, 520, 260, 0.08]],
      phone: { x: 60, y: 132, w: 250 } },
    agent: { height: 660, win: { x: 120, y: 56, scale: 0.88 }, crop: { x: 0, y: 0 }, glows: [[40, 60, 520, 320, 0.13]] },
    coin: { height: 700, win: { x: 64, y: 56, scale: 0.86 }, crop: { x: 0, y: 0 }, glows: [[200, 40, 640, 300, 0.12]] },
    graph: { height: 600, win: { x: 48, y: 56, scale: 0.66 }, crop: { x: 0, y: 0 }, glows: [[220, 120, 560, 300, 0.12]] },
  };

  window.render = async ({ layout, shot, phone: phoneShot, backdrop, url }) => {
    const L = LAYOUTS[layout];
    const card = document.getElementById('card');
    card.style.height = `${L.height}px`;
    if (backdrop) document.getElementById('atmos').style.backgroundImage = `url(${backdrop.src})`;
    for (const [x, y, w, h, a] of L.glows) {
      const g = document.createElement('div');
      g.className = 'glow';
      Object.assign(g.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, background: `rgba(255, 184, 107, ${a})` });
      card.prepend(g);
    }
    const s = L.win.scale;
    const box = { x: L.win.x, y: L.win.y, w: Math.round((shot.width - L.crop.x) * s), h: 34 + Math.round((shot.height - L.crop.y) * s) };
    // Keep the address pill over the part of the bar that is inside the card.
    const left = Math.max(box.x, 0), right = Math.min(box.x + box.w, 1000);
    const win = browserWindow({ box, shot, crop: L.crop, scale: s, url, urlCenter: (left + right) / 2 });
    card.insertBefore(win, card.querySelector('.fade-bottom'));
    if (L.phone && phoneShot) {
      const w = L.phone.w, h = Math.round(w * phoneShot.height / phoneShot.width);
      card.insertBefore(phone({ box: { x: L.phone.x, y: L.phone.y, w, h }, shot: phoneShot }), card.querySelector('.fade-bottom'));
    }
    await settle();
  };
</script>
</body>
</html>
