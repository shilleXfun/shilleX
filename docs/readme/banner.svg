      <rect width="120" height="54" rx="12" class="chip"/>
      <rect width="120" height="54" rx="12" class="flash up" style="animation-delay:0s"/>
      <text x="14" y="23" class="sym">$PENGU</text>
      <text x="14" y="42" class="pct up">+18%</text>
    </g>
    <g transform="translate(196 470)">
      <rect width="120" height="54" rx="12" class="chip"/>
      <rect width="120" height="54" rx="12" class="flash down" style="animation-delay:1.3s"/>
      <text x="14" y="23" class="sym">$BONK</text>
      <text x="14" y="42" class="pct down">−6.2%</text>
    </g>
    <g transform="translate(328 470)">
